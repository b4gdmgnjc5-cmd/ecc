<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maison Insoumise</title>
  <meta name="description" content="Collection Tricolore : six pièces militantes, présentées dans une boutique de nuit en 3D. Boutique indépendante, non affiliée à La France insoumise." />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="Boutique 3D : faites défiler pour passer d'une pièce à l'autre"></canvas>

  <div id="loader" class="loader" aria-hidden="true">
    <span class="loader__mark">Maison Insoumise</span>
    <span class="loader__line"><i id="loaderBar"></i></span>
  </div>

  <header class="top">
    <a class="brand" href="#" id="homeLink">Maison Insoumise</a>
    <button class="link" id="cartBtn" aria-haspopup="dialog">Panier (<span id="cartCount">0</span>)</button>
  </header>

  <section id="hero" class="hero" aria-label="Introduction">
    <p class="hero__eyebrow"><span class="tri" aria-hidden="true"></span>Collection Tricolore</p>
    <h1 class="hero__title">Maison<br /><em>Insoumise</em></h1>
    <p class="hero__hint"><span class="hint-desktop">Défilez pour entrer</span><span class="hint-touch">Glissez pour entrer</span></p>
  </section>

  <aside id="hud" class="hud" aria-live="polite">
    <div class="hud__id">
      <h2 id="hudName" class="hud__name">—</h2>
      <p class="hud__sub"><span id="hudPrice"></span> · <span id="hudDetail"></span></p>
    </div>
    <div id="hudSizes" class="sizes" role="radiogroup" aria-label="Taille"></div>
    <button id="hudAdd" class="cta">Ajouter au panier</button>
  </aside>

  <div class="progress" aria-hidden="true"><i id="progressFill"></i></div>

  <section id="finale" class="finale" aria-label="Fin de la collection">
    <h2 class="finale__title"><em>Merci.</em></h2>
    <div class="finale__actions">
      <button class="cta" id="finaleCart">Voir le panier · <span id="finaleTotal">0 €</span></button>
      <button class="link" id="restart">Revoir la collection</button>
    </div>
  </section>

  <section id="listView" class="list" aria-label="La collection" hidden>
    <h2 class="list__title">La collection</h2>
    <div class="list__grid" id="listGrid"></div>
  </section>

  <div id="cart" class="cart" role="dialog" aria-modal="true" aria-labelledby="cartTitle" hidden>
    <div class="cart__backdrop" data-close></div>
    <div class="cart__panel">
      <div class="cart__head">
        <h2 id="cartTitle">Panier</h2>
        <button class="link" data-close id="cartClose">Fermer</button>
      </div>
      <ul class="cart__items" id="cartItems"></ul>
      <div class="cart__foot">
        <div class="cart__total"><span>Total</span><b id="cartTotal">0 €</b></div>
        <button class="cta" disabled title="Démonstration : paiement non branché">Commander</button>
        <p class="cart__note">Démonstration · paiement non branché</p>
      </div>
    </div>
  </div>

  <footer class="legal">Boutique indépendante, non affiliée à La France insoumise</footer>

  <noscript><p class="noscript">Cette boutique 3D a besoin de JavaScript.</p></noscript>
  <script type="module" src="main.js"></script>
</body>
</html>
